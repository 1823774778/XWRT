# SPDX-License-Identifier: MIT
# XWRT: reusable OpenWrt build workflow inspired by OpenWRT-CI.
name: XWRT Build

on:
  workflow_dispatch:
    inputs:
      target:
        description: OpenWrt target configuration
        required: true
        default: IPQ60XX
        type: choice
        options:
          - IPQ60XX
          - X86
          - ROCKCHIP
      package:
        description: Additional package config lines, one per line
        required: false
        type: string
      test_only:
        description: Generate .config without compiling
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: xwrt-${{ github.workflow }}-${{ github.ref }}-${{ inputs.target || 'IPQ60XX' }}
  cancel-in-progress: true

env:
  SOURCE_REPO: https://github.com/VIKINGYFY/immortalwrt.git
  SOURCE_BRANCH: owrt
  BUILD_DIR: wrt
  CCACHE_MAXSIZE: 2G
  WRT_IP: 192.168.10.1
  WRT_WORD: '12345678'

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout XWRT
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential bzip2 ca-certificates ccache clang cmake cpio curl \
            device-tree-compiler file flex gawk gcc-multilib g++-multilib gettext \
            git libbpf-dev libclang-dev libdw-dev libelf-dev libncurses-dev libssl-dev \
            lld llvm ninja-build patch perl pkgconf python3 python3-dev \
            python3-cryptography python3-packaging python3-pyelftools \
            python3-setuptools qemu-utils rsync swig genisoimage jq \
            unzip wget xsltproc xz-utils zlib1g-dev zstd

      - name: Set up bootstrap Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: false

      - name: Clone ImmortalWrt source
        id: source
        run: |
          git clone --depth=1 --single-branch --branch "$SOURCE_BRANCH" "$SOURCE_REPO" "$BUILD_DIR"
          printf 'commit=%s\n' "$(git -C "$BUILD_DIR" rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Drop unreachable package mirrors
        working-directory: ${{ env.BUILD_DIR }}
        run: |
          # Runner egress cannot reach the bundled Chinese mirrors, so download.pl
          # must fall back to the upstream sources instead of timing out.
          mirrors=scripts/projectsmirrors.json
          if [ -f "$mirrors" ]; then
            cp "$mirrors" "$mirrors.orig"
            sed -i '/\.cn\//d; /tencent/d; /aliyun/d' "$mirrors"
            if python3 -c "import json; json.load(open('$mirrors'))"; then
              rm "$mirrors.orig"
            else
              mv "$mirrors.orig" "$mirrors"
            fi
          fi

      - name: Allow regenerated firewall4 source archive
        working-directory: ${{ env.BUILD_DIR }}
        run: |
          # sources.openwrt.org has no archive for the pinned firewall4 commit, so
          # download.pl regenerates it locally and the pinned mirror hash can never
          # match. Keep the pinned commit and skip only that tarball hash.
          sed -i 's|^PKG_MIRROR_HASH:=.*|PKG_MIRROR_HASH:=skip|' \
            package/network/config/firewall4/Makefile
          grep -qx 'PKG_MIRROR_HASH:=skip' package/network/config/firewall4/Makefile

      - name: Restore compiler cache
        id: cache-restore
        if: ${{ inputs.test_only != true }}
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.BUILD_DIR }}/.ccache
          key: xwrt-${{ runner.os }}-${{ inputs.target || 'IPQ60XX' }}-${{ steps.source.outputs.commit }}
          restore-keys: |
            xwrt-${{ runner.os }}-${{ inputs.target || 'IPQ60XX' }}-${{ steps.source.outputs.commit }}-
            xwrt-${{ runner.os }}-${{ inputs.target || 'IPQ60XX' }}-

      - name: Update and install feeds
        working-directory: ${{ env.BUILD_DIR }}
        run: |
          cp feeds.conf.default feeds.conf
          printf '%s\n' \
            'src-git vantage https://github.com/anothaDev/luci-theme-vantage.git;main' \
            'src-git viking https://github.com/VIKINGYFY/packages.git;main' \
            'src-git meshzw https://github.com/1823774778/meshzw.git;main' >> feeds.conf
          ./scripts/feeds update -a
          ./scripts/feeds install -a -p packages
          ./scripts/feeds install -a -p luci
          ./scripts/feeds install -a
          ./scripts/feeds install -p vantage luci-theme-vantage

      - name: Add OpenAppFilter package
        working-directory: ${{ env.BUILD_DIR }}
        run: |
          # The packages feed ships an older open-app-filter that defines the
          # same appfilter/kmod-oaf symbols and breaks kconfig resolution.
          rm -rf package/feeds/*/open-app-filter
          git clone --depth=1 --single-branch --branch master \
            https://github.com/destan19/OpenAppFilter.git package/OpenAppFilter
          # Use the official free Chinese feature library instead of the barely
          # populated one bundled with the package.
          feature_dir="$RUNNER_TEMP/openappfilter-feature"
          rm -rf "$feature_dir"
          mkdir -p "$feature_dir"
          tar -xzf "$GITHUB_WORKSPACE/Files/OpenAppFilter/feature4.0_cn_26.09.10-free.tar.gz" -C "$feature_dir"
          install -m 0644 "$feature_dir/feature.bin" \
            package/OpenAppFilter/open-app-filter/files/feature.bin
          cp "$feature_dir/app_icons/"*.png \
            package/OpenAppFilter/luci-app-oaf/htdocs/luci-static/resources/oaf/app_icons/
          echo "01602a7c86a33c2f50a3dc661971a4cf  package/OpenAppFilter/open-app-filter/files/feature.bin" | md5sum -c -

      - name: Add XWRT OTA package
        if: ${{ inputs.target == 'IPQ60XX' }}
        working-directory: ${{ env.BUILD_DIR }}
        run: |
          git clone --depth=1 --single-branch --branch main \
            https://github.com/1823774778/openwrt-ota.git "$RUNNER_TEMP/openwrt-ota"
          cp -a "$RUNNER_TEMP/openwrt-ota/luci-app-xwrt-ota" package/luci-app-xwrt-ota

      - name: Prepare configuration
        env:
          TARGET: ${{ inputs.target || 'IPQ60XX' }}
          EXTRA_PACKAGES: ${{ inputs.package }}
        run: |
          set -euo pipefail
          cd "$BUILD_DIR"
          cat "../Config/${TARGET}.txt" "../Config/GENERAL.txt" > .config
          if [ -n "${EXTRA_PACKAGES:-}" ]; then
            printf '%s\n' "$EXTRA_PACKAGES" >> .config
          fi
          bash ../Scripts/Settings.sh
          bash ../Scripts/Prepare.sh
          make defconfig
          grep -qx 'CONFIG_USE_APK=y' .config
          grep -qx 'CONFIG_PACKAGE_apk-openssl=y' .config
          grep -qx 'CONFIG_PACKAGE_luci-app-oaf=y' .config
          grep -qx 'CONFIG_PACKAGE_kmod-oaf=y' .config
          test -f files/etc/apk/config
          test -f files/etc/apk/repositories.d/customfeeds.list
          grep -Fqx 'allow-untrusted' files/etc/apk/config
          grep -Fq 'Official target and feed repositories are generated in distfeeds.list.' files/etc/apk/repositories.d/customfeeds.list
          if [ "$TARGET" = IPQ60XX ]; then
            expected=$(printf '%s\n' \
              'CONFIG_TARGET_DEVICE_qualcommax_ipq60xx_DEVICE_jdcloud_re-cs-02=y' \
              'CONFIG_TARGET_DEVICE_qualcommax_ipq60xx_DEVICE_jdcloud_re-ss-01=y')
            selected=$(grep -E '^CONFIG_TARGET_DEVICE_.*=y$' .config | sort)
            if [ "$selected" != "$expected" ]; then
              printf 'Unexpected device selection:\n%s\n' "$selected" >&2
              exit 1
            fi
            grep -qx 'CONFIG_PACKAGE_luci-app-router-tool=y' .config
            grep -qx 'CONFIG_PACKAGE_luci-app-wifiroam=y' .config
            grep -qx 'CONFIG_PACKAGE_wifiroam=y' .config
            test -f package/feeds/meshzw/luci-app-wifiroam/Makefile
            test -f package/feeds/meshzw/wifiroam/Makefile
            grep -q 'option auto_relay_ap '\''1'\''' package/emortal/luci-app-router-tool/root/etc/config/router-tool
            test -f package/emortal/luci-app-router-tool/root/usr/share/router-tool/relay_ap.uc
            grep -q 'relay_ap.enable' package/emortal/luci-app-router-tool/root/usr/share/router-tool/auto.uc
            grep -q 'ap_auto' package/emortal/luci-app-router-tool/root/usr/share/router-tool/auto.uc
            grep -q 'restore_needed' package/emortal/luci-app-router-tool/root/usr/share/router-tool/relay_ap.uc
            grep -q 'relay_ap.disable' package/emortal/luci-app-router-tool/root/usr/libexec/router-tool-auto
            grep -q 'auto_relay_ap_disabled' package/emortal/luci-app-router-tool/htdocs/luci-static/resources/tools/router-tool.js
            grep -q "option ssid 'XWRT'" package/emortal/luci-app-router-tool/root/etc/config/router-tool
            if grep -q 'xwrt_managed_ssid' package/emortal/luci-app-router-tool/root/usr/share/router-tool/wireless.uc; then exit 1; fi
            if test -e files/etc/uci-defaults/98-xwrt-wifi; then exit 1; fi
            if grep -q "country='CN'" package/network/config/wifi-scripts/files/lib/wifi/mac80211.uc; then exit 1; fi
          fi

      - name: Generate configuration only
        if: ${{ inputs.test_only == true }}
        run: cp "$BUILD_DIR/.config" "XWRT-${{ inputs.target || 'IPQ60XX' }}.config"

      - name: Prepare Rust toolchain
        if: ${{ inputs.test_only != true }}
        working-directory: ${{ env.BUILD_DIR }}
        run: bash ../Scripts/Prepare-Rust.sh

      - name: Download sources
        if: ${{ inputs.test_only != true }}
        run: |
          make -C "$BUILD_DIR" download -j"$(nproc)" || \
            make -C "$BUILD_DIR" download -j1 V=s

      - name: Compile firmware
        if: ${{ inputs.test_only != true }}
        run: |
          mkdir -p build-reports
          make -C "$BUILD_DIR" -j"$(nproc)" BUILD_TIME_LOG="$GITHUB_WORKSPACE/build-reports/parallel.tsv" || \
            make -C "$BUILD_DIR" -j1 V=s BUILD_TIME_LOG="$GITHUB_WORKSPACE/build-reports/serial.tsv"

      - name: Collect build reports
        if: ${{ always() && !cancelled() }}
        continue-on-error: true
        working-directory: ${{ env.BUILD_DIR }}
        run: bash ../Scripts/Collect-Reports.sh

      - name: Upload build reports
        if: ${{ always() && !cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: xwrt-reports-${{ inputs.target || 'IPQ60XX' }}-${{ github.run_attempt }}
          path: |
            build-reports/
            ${{ env.BUILD_DIR }}/logs/
          if-no-files-found: warn
          retention-days: 7

      - name: Save compiler cache
        if: ${{ success() && inputs.test_only != true && steps.cache-restore.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ env.BUILD_DIR }}/.ccache
          key: xwrt-${{ runner.os }}-${{ inputs.target || 'IPQ60XX' }}-${{ steps.source.outputs.commit }}

      - name: Upload configuration
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: xwrt-config-${{ inputs.target || 'IPQ60XX' }}
          include-hidden-files: true
          path: |
            ${{ inputs.test_only == true && format('XWRT-{0}.config', inputs.target || 'IPQ60XX') || format('{0}/.config', env.BUILD_DIR) }}

      - name: Upload firmware
        if: ${{ inputs.test_only != true }}
        uses: actions/upload-artifact@v4
        with:
          name: xwrt-firmware-${{ inputs.target || 'IPQ60XX' }}
          path: ${{ env.BUILD_DIR }}/bin/targets/**
          if-no-files-found: error

      - name: Prepare release assets and notes
        id: release
        if: ${{ success() && inputs.test_only != true }}
        env:
          RELEASE_TARGET: ${{ inputs.target || 'IPQ60XX' }}
        run: python3 Scripts/Package-Release.py

      - name: Publish firmware release
        if: ${{ success() && inputs.test_only != true }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_NAME: ${{ steps.release.outputs.name }}
        run: |
          gh release create "$RELEASE_TAG" release/assets/*.bin \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_NAME" \
            --notes-file release/release-notes.md
